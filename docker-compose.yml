# ============================================================================
# OVERLEAF-STRATUM — Collaborative LaTeX Platform
# Stratum Consumer Pattern
# ============================================================================
#
# Component ......... overleaf
# Function .......... Multi-user LaTeX collaboration platform.
# Pattern ........... Stratum Consumer
# Artifact .......... docker-compose.yml
# Revision .......... 1.1.0
# Status ............ Production
#
# ----------------------------------------------------------------------------
# 1. ARCHITECTURAL OVERVIEW
# ----------------------------------------------------------------------------
# This service operates strictly as a Stratum Consumer:
#
#   - Does NOT provision global networks; attaches to `stratum_dmz` as external.
#   - Does NOT provision local database instances; consumes MongoDB and Redis
#     engines centrally via the Stratum Layer 4 Boundary TCP Proxy
#     (`stratum-database-nginx`).
#   - Does NOT expose host-level ports; all ingress traffic is routed internally
#     via Nginx Proxy Manager (NPM) on `stratum_dmz`.
#
# ----------------------------------------------------------------------------
# 2. NETWORK TOPOLOGY
# ----------------------------------------------------------------------------
#   stratum_dmz (external)
#     Shared Demilitarized Zone. Provisioned by `stratum/dmz`.
#     - Receives inbound HTTP/WS traffic from Stratum Gateway (NPM).
#     - Communicates with `stratum-database-nginx` for MongoDB (:27017)
#       and Redis (:6379) persistence.
#
# ----------------------------------------------------------------------------
# 3. DEPLOYMENT ORDER & RUNBOOK
# ----------------------------------------------------------------------------
#   1. stratum/dmz/          -> provisions stratum_dmz network
#   2. stratum/gateway/      -> deploys Cloudflare Tunnel & NPM
#   3. stratum/database/     -> deploys MongoDB, Redis & L4 Boundary Proxy
#   4. overleaf/ (this)      -> attaches to stratum_dmz and boots ShareLaTeX
#
# After deployment, configure a Proxy Host in Nginx Proxy Manager (NPM):
#   Domain Names ....... latex.yourdomain.com
#   Forward Hostname ... overleaf-<tenant>-app (e.g. overleaf-sgpt-app)
#   Forward Port ....... 80
#   Scheme ............. http
#   Websockets ......... Enabled
# ============================================================================

x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

name: ${COMPOSE_PROJECT_NAME:-overleaf-${TENANT_ID:-default}}

services:

  sharelatex:
    <<: *defaults
    image: ${OVERLEAF_IMAGE:-sharelatex/sharelatex:6.2.2}
    container_name: ${OVERLEAF_CONTAINER_NAME:-overleaf-${TENANT_ID:-default}-app}
    init: true

    environment:
      TZ: ${TZ:-America/Bogota}

      # --- Application Identity & Public Endpoints ---
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME:-"Overleaf LaTeX"}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-https://latex.example.com}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE:-"LaTeX Studio"}

      # --- Transversal Persistence (Stratum Boundary Proxy) ---
      OVERLEAF_MONGO_URL: mongodb://${MONGO_APP_USER:-${TENANT_ID:-default}_overleaf_app}:${MONGO_APP_PASSWORD}@${STRATUM_DB_HOST:-stratum-database-nginx}:27017/${MONGO_DB_NAME:-${TENANT_ID:-default}_overleaf}?authSource=${MONGO_AUTH_SOURCE:-admin}${MONGO_EXTRA_PARAMS:-}
      OVERLEAF_REDIS_HOST: ${STRATUM_DB_HOST:-stratum-database-nginx}
      OVERLEAF_REDIS_PORT: ${STRATUM_REDIS_PORT:-6379}
      OVERLEAF_REDIS_PASS: ${REDIS_PASSWORD}

      # --- Proxy, Session & Security Secrets ---
      OVERLEAF_BEHIND_PROXY: "true"
      OVERLEAF_SECURE_COOKIE: "true"
      OVERLEAF_TRUSTED_PROXY_IPS: loopback,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET}
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET}

      # --- Security, Node & Compilation Safeguards ---
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
      OVERLEAF_ALLOW_PUBLIC_ACCESS: ${OVERLEAF_ALLOW_PUBLIC_ACCESS:-"false"}
      EMAIL_CONFIRMATION_DISABLED: ${EMAIL_CONFIRMATION_DISABLED:-"true"}
      ENABLE_CONVERSIONS: ${ENABLE_CONVERSIONS:-"true"}
      TEXLIVE_PATH: /usr/local/texlive
      ALLOW_MONGO_ADMIN_CHECK_FAILURES: "true"

    volumes:
      - sharelatex_data:/var/lib/overleaf

    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var/run:size=16m,mode=0755

    networks:
      - stratum_dmz

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 2048
        hard: 4096

    stop_signal: SIGTERM
    stop_grace_period: 30s

    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2.0}"
          memory: "${MEM_LIMIT:-3.0G}"
          pids: 400
        reservations:
          memory: "${MEM_RESERVATION:-1.0G}"

    labels:
      org.opencontainers.image.authors: "Sandra Gabriela Puerto Torres <contacto@sandrapuerto.com>"
      com.sandrapuerto.architecture: "Stratum-Core"
      com.sandrapuerto.website: "https://sandrapuerto.com"
      com.stratum.tenant: "${TENANT_ID:-default}"
      com.stratum.project: "overleaf-${TENANT_ID:-default}"
      com.stratum.pattern: "stratum-consumer"
      com.stratum.role: "latex-platform"
      com.stratum.revision: "1.1.0"

    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/health_check || curl -f -s http://127.0.0.1:80/ || exit 1"]
      interval: 25s
      start_interval: 5s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  sharelatex_data:
    name: ${OVERLEAF_VOLUME_NAME:-overleaf_${TENANT_ID:-default}_data}

networks:
  stratum_dmz:
    name: ${STRATUM_DMZ_NETWORK:-stratum_dmz}
    external: true